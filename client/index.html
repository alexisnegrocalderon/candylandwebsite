<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mansion Playroom — Fiesta Liberal en Viña del Mar | +18</title>
    <meta name="description" content="La fiesta liberal más grande de la V Región: 2 pistas, Playground XXL y Kink Room. Comunidad, consentimiento y una noche para salir a bailar en Viña del Mar y Valparaíso. Evento +18." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FF4FC3" />
    <link rel="canonical" href="https://mansionplayroom.cl/" />

    <!-- Open Graph (WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mansion Playroom" />
    <meta property="og:title" content="Mansion Playroom — Fiesta Liberal en Viña del Mar" />
    <meta property="og:description" content="La fiesta liberal más grande de la V Región. 2 pistas, Playground XXL, Kink Room. Evento +18." />
    <meta property="og:url" content="https://mansionplayroom.cl/" />
    <meta property="og:image" content="https://mansionplayroom.cl/candyland/og-candyland.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CL" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mansion Playroom — Fiesta Liberal en Viña del Mar" />
    <meta name="twitter:description" content="La fiesta liberal más grande de la V Región. Evento +18. Compra tu acceso." />
    <meta name="twitter:image" content="https://mansionplayroom.cl/candyland/og-candyland.jpg" />

    <!-- Favicon en PNG/ICO (no solo WebP): Google Search y navegadores viejos
         no siempre levantan favicons en WebP -- por eso el ícono no aparecía
         en los resultados de búsqueda pese a tener el link a logo-isotipo.webp. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/candyland/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/candyland/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/candyland/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/candyland/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/candyland/favicon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Precarga de la imagen del hero (poster del video de portada): el Home
         se carga por JS (code-splitting), así que sin esto el navegador no
         sabe que tiene que pedirla hasta que el chunk de la página corre. La
         mayoría de las visitas entran por el Home (links de Instagram/
         WhatsApp), así que vale la pena pedirla siempre aunque en el resto de
         las rutas no se use. -->
    <link rel="preload" as="image" href="/candyland/poster-hero.webp" fetchpriority="high" />

    <!-- Loader inicial: inline y sin depender de React/Tailwind, así pinta
         en el primer frame (nunca hay un instante en blanco mientras carga
         el bundle). App.tsx lo saca del DOM apenas React monta. -->
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(0.97 0.014 340);
      }
      #initial-loader img {
        width: 56px;
        height: 56px;
        animation: initial-loader-pulse 1.1s ease-in-out infinite;
      }
      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 0.45; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader img { animation: none; opacity: 0.85; }
      }
    </style>

    <!-- Datos estructurados GLOBALES: solo el negocio y el sitio, que valen
         para todas las páginas y no cambian con el evento de turno. Lo de cada
         página (el evento, las FAQ, las migas) lo declara la página vía
         `useSeo({ jsonLd })` -- ver shared/structuredData.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NightClub",
        "name": "Mansion Playroom",
        "description": "Vida nocturna, comunidad y experiencias premium para salir a bailar en Viña del Mar y Valparaíso.",
        "url": "https://mansionplayroom.cl/",
        "image": "https://mansionplayroom.cl/candyland/og-candyland.jpg",
        "telephone": "+56933135140",
        "priceRange": "$20.000 - $40.000 CLP",
        "currenciesAccepted": "CLP",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Valparaíso",
          "addressRegion": "Región de Valparaíso",
          "addressCountry": "CL"
        },
        "areaServed": ["Valparaíso", "Viña del Mar", "Región de Valparaíso"],
        "sameAs": [
          "https://instagram.com/mansionplayroom.cl",
          "https://tiktok.com/@mansionplayroom"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mansion Playroom",
        "url": "https://mansionplayroom.cl/",
        "inLanguage": "es-CL"
      }
    </script>
  </head>
  <body>
    <div id="initial-loader"><img src="/candyland/favicon-112.png" alt="" width="56" height="56" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
