<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--app-head-->
    <meta name="theme-color" content="#FF4FC3" />

    <!-- Favicon en PNG/ICO (no solo WebP): Google Search y navegadores viejos
         no siempre levantan favicons en WebP -- por eso el ícono no aparecía
         en los resultados de búsqueda pese a tener el link a logo-isotipo.webp. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/candyland/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/candyland/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/candyland/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/candyland/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/candyland/favicon-180.png" />

    <!-- Fuentes autohospedadas (antes: Google Fonts). Cada una es un único
         archivo variable (cubre todos los pesos usados, 300-700 y 400-800)
         para el subset "latin" -- alcanza para español (incluye ñ, tildes).
         Esto saca de la ruta crítica el viaje a fonts.googleapis.com +
         fonts.gstatic.com (DNS/TLS + 2 hops), que quedaba bloqueando el
         primer render aunque ya tuviera preconnect. display=optional se
         mantiene: si el archivo no llega a tiempo (~100ms), el navegador se
         queda con la fuente de reemplazo para toda la carga en vez de
         cambiarla después -- el <h1> gigante del hero (letras animadas una
         por una) cambiaba de ancho al hacer swap, y eso salía como CLS alto
         en PageSpeed Mobile. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/syne-variable.woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 300 700;
        font-display: optional;
        src: url('/fonts/space-grotesk-variable.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 400 800;
        font-display: optional;
        src: url('/fonts/syne-variable.woff2') format('woff2');
      }
    </style>

    <!-- Precarga del fondo borroso del hero (liviana, ~18KB, 480x270, se
         muestra siempre con blur-3xl) -- para todos los anchos. -->
    <link rel="preload" as="image" href="/candyland/poster-hero-bg.webp" fetchpriority="high" />

    <!-- Precarga del poster nítido del <video> (960x540/~41KB) -- SOLO desde
         768px (el breakpoint `md:` que ya usa el resto del sitio). En
         Escritorio (menos throttling que Mobile en el preset de Lighthouse)
         el navegador SÍ llega a pintar el poster del video a tiempo y gana
         como LCP sobre el fondo borroso, así que sin precargarlo PageSpeed
         Desktop marcaba el LCP como "no descubrible". Pero en Mobile el
         video no llega a tiempo igual (gana el fondo borroso, que ya está
         precargado arriba) -- ahí este segundo preload no aporta nada y solo
         suma ~41KB compitiendo por ancho de banda con el CSS/fuentes
         críticos en una conexión 4G lenta, que fue justo lo que hundió el
         puntaje de Mobile (89 -> 51) cuando este preload no tenía el filtro
         de `media`. El atributo `media` hace que el navegador ni siquiera
         pida el archivo si el viewport no matchea, así que en Mobile el
         comportamiento vuelve a ser exactamente el de antes de este link. -->
    <link rel="preload" as="image" href="/candyland/poster-hero.webp" fetchpriority="high" media="(min-width: 768px)" />

    <!-- Loader inicial: inline y sin depender de React/Tailwind, así pinta
         en el primer frame (nunca hay un instante en blanco mientras carga
         el bundle). App.tsx lo saca del DOM apenas React monta. -->
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(0.97 0.014 340);
      }
      #initial-loader img {
        width: 56px;
        height: 56px;
        animation: initial-loader-pulse 1.1s ease-in-out infinite;
      }
      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 0.45; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader img { animation: none; opacity: 0.85; }
      }
    </style>

    <!-- Datos estructurados GLOBALES: solo el negocio y el sitio, que valen
         para todas las páginas y no cambian con el evento de turno. Lo de cada
         página (el evento, las FAQ, las migas) lo declara la página vía
         `useSeo({ jsonLd })` -- ver shared/structuredData.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NightClub",
        "name": "Mansion Playroom",
        "description": "Vida nocturna, comunidad y experiencias premium para salir a bailar en Viña del Mar y Valparaíso.",
        "url": "https://mansionplayroom.cl/",
        "image": "https://mansionplayroom.cl/candyland/og-candyland.jpg",
        "telephone": "+56933135140",
        "priceRange": "$20.000 - $40.000 CLP",
        "currenciesAccepted": "CLP",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Valparaíso",
          "addressRegion": "Región de Valparaíso",
          "addressCountry": "CL"
        },
        "areaServed": ["Valparaíso", "Viña del Mar", "Región de Valparaíso"],
        "sameAs": [
          "https://instagram.com/mansionplayroom.cl",
          "https://tiktok.com/@mansionplayroom"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mansion Playroom",
        "url": "https://mansionplayroom.cl/",
        "inLanguage": "es-CL"
      }
    </script>
  </head>
  <body>
    <div id="initial-loader"><img src="/candyland/favicon-112.png" alt="" width="56" height="56" /></div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
