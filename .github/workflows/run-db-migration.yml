name: One-off DB migration

# Disparado a mano para aplicar drizzle/0040 (operators.email) y 0041
# (siteSettings.kitchenVendor*) contra producción, corriendo desde los
# runners de GitHub porque el sandbox del asistente no tiene salida TCP
# directa a TiDB (solo HTTPS por proxy). Requiere el secret MIGRATION_DB_URL
# con el connection string completo. Este archivo se borra después de usarse.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose (solo lee) / apply (aplica 0040+0041 a mano) / migrate (CLI de drizzle-kit, no soporta el SSL de TiDB)'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - apply
          - migrate

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - if: inputs.mode == 'diagnose'
        run: node scripts/diagnose-migrations.cjs
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_URL }}
      - if: inputs.mode == 'apply'
        run: node scripts/apply-0040-0041.cjs
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_URL }}
      - if: inputs.mode == 'migrate'
        run: pnpm drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DB_URL }}
