# Graba a MP4 un video del Estudio Motion (admin → Contenido → Estudio) con
# Remotion: la misma composición de motion/ que se ve en el panel. Lo dispara
# el sitio (server/studioRender.ts) al apretar «Grabar MP4»; no corre con
# pushes ni PRs.
#
# El repo es público: estos inputs los ve cualquiera, así que no llevan nada
# secreto. El proyecto y el permiso para subir el MP4 se piden al sitio con
# el secreto RENDER_CALLBACK_SECRET (Settings → Secrets and variables →
# Actions), el mismo valor que la variable de Vercel con ese nombre.
name: Grabar video del Estudio

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Id del video en el Estudio
        required: true
      job_id:
        description: Id de esta grabación
        required: true
      site:
        description: Dirección del sitio que pidió la grabación
        required: true
        default: https://mansionplayroom.cl

permissions:
  contents: read

concurrency:
  group: render-video-${{ inputs.video_id }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Solo lo que necesita la grabación: la composición, la receta compartida,
      # las fuentes, la música, los efectos y el logo.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            motion/
            shared/motionSpec.ts
            scripts/render-studio-video.mjs
            client/public/studio/
            client/public/motion/
            client/public/fonts/
            client/public/candyland/logo-isotipo-transparent.png
            client/public/candyland/logo-wordmark-email.png
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lo pesado se guarda entre grabaciones: las dependencias de Remotion y su
      # navegador (Chrome Headless Shell). Con eso una grabación tarda 1 a 3 minutos.
      - name: Caché de Remotion
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            motion/node_modules
          key: render-motion-${{ runner.os }}-${{ hashFiles('motion/package-lock.json') }}-v1

      - name: Dependencias
        timeout-minutes: 5
        run: |
          if [ ! -d motion/node_modules/remotion ]; then npm ci --prefix motion --no-audit --no-fund; fi

      # Emojis (✅ ❌ 🔥…) de los textos: si no se logra, se graba igual, solo que sin ellos.
      - name: Fuente de emojis
        continue-on-error: true
        timeout-minutes: 4
        run: |
          if ! fc-list | grep -qi "color emoji"; then
            sudo timeout 100 apt-get install -y -qq --no-install-recommends fonts-noto-color-emoji \
              || { sudo timeout 60 apt-get update -qq && sudo timeout 100 apt-get install -y -qq --no-install-recommends fonts-noto-color-emoji; }
          fi

      - name: Grabar y subir
        timeout-minutes: 10
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          JOB_ID: ${{ inputs.job_id }}
          SITE: ${{ inputs.site }}
          RENDER_CALLBACK_SECRET: ${{ secrets.RENDER_CALLBACK_SECRET }}
        run: node scripts/render-studio-video.mjs
